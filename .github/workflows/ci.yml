name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test routing and deploy config
        run: npm test

      - name: Verify sitemap generation runs cleanly
        run: npm run generate:sitemap

      - name: Build landing assets
        run: npm run build:assets

      - name: Validate landing assets
        run: npm run validate
