# Rebuilds public sitemap XML from live URLs and commits when files change.
# Does NOT submit to Google Search Console or Bing — that stays a manual UI step.
name: Refresh sitemap files (manual Search Console / Bing)

on:
  schedule:
    - cron: "25 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap-indexing
  cancel-in-progress: false

jobs:
  sitemap:
    name: Refresh sitemap files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Generate sitemap files
        run: npm run build

      - name: Commit sitemap updates
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- public/sitemap.xml public/sitemap-main.xml public/sitemap-subdomains.xml public/robots.txt; then
            echo "Sitemaps already up to date (no commit)."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/sitemap.xml public/sitemap-main.xml public/sitemap-subdomains.xml public/robots.txt
            # Drop retired child if still tracked from an older generate run.
            git rm -f --ignore-unmatch public/sitemap-projects.xml
            git commit -m "chore: refresh sitemap index and sitemap files"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
            echo "Committed and pushed refreshed sitemap files. Deploy picks them up from main."
          fi

      - name: Manual next — paste sitemap in Search Console and Bing
        run: |
          cat <<'EOF'
          ============================================================
          MANUAL ACTION REQUIRED (this job does not index anything)
          ============================================================

          This workflow only rebuilds and commits sitemap XML.
          Google and Bing do not get notified by this run. Classic
          sitemap ping endpoints are retired. You still paste the
          sitemap URL in each webmaster UI when you want a refresh
          or first-time submit.

          Copy this sitemap URL (apex index):

          https://javan.de/sitemap.xml

          Google Search Console — open Sitemaps, paste the URL above:

          https://search.google.com/search-console/sitemaps?resource_id=sc-domain%3Ajavan.de

          (If that property link 404s, open https://search.google.com/search-console
          → property javan.de → Indexing → Sitemaps → Add a new sitemap.)

          Bing Webmaster Tools — Sitemaps, paste the same URL:

          https://www.bing.com/webmasters/sitemaps

          (First time on Bing: import the Google property, or add
          https://javan.de/ as a site, then submit the sitemap.)

          Optional URL inspection (not the sitemap job): request
          indexing for high-priority pages in Search Console URL
          inspection when you need a faster recrawl.

          ============================================================
          EOF
