<svg class="ghost" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="48" height="48" aria-hidden="true" focusable="false">
  <style>
    .ghost__feet--b { opacity: 0; }
    .ghost__feet--a { animation: skirt 0.45s steps(1) infinite; }
    .ghost__feet--b { animation: skirt 0.45s steps(1) infinite reverse; }
    @keyframes skirt {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ghost__feet--a,
      .ghost__feet--b { animation: none; }
      .ghost__feet--b { opacity: 0; }
    }
  </style>
